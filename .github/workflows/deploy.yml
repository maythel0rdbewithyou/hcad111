# Rebuild the parcel data and deploy everything (app, chunked parcel tiles,
# search index) to Cloudflare Pages. No R2 / no payment method needed.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   secret   CLOUDFLARE_API_TOKEN (or KEY)  token with Account: Cloudflare Pages Edit
#   variable CLOUDFLARE_ACCOUNT_ID          your Cloudflare account ID
#   variable PAGES_PROJECT                  (optional) Pages project name, default parcel-earth
name: Build data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 3 * *' # monthly refresh from TAD

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.KEY || vars.CLOUDFLARE_API_TOKEN || vars.KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'parcel-earth' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check Cloudflare settings (names only, never values)
        env:
          S_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          S_KEY: ${{ secrets.KEY != '' }}
          V_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          V_KEY: ${{ vars.KEY != '' }}
        run: |
          echo "secret CLOUDFLARE_API_TOKEN set: $S_TOKEN"
          echo "secret KEY set:                  $S_KEY"
          echo "variable CLOUDFLARE_API_TOKEN set: $V_TOKEN"
          echo "variable KEY set:                  $V_KEY"
          echo "variable CLOUDFLARE_ACCOUNT_ID set: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo true || echo false)"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No Cloudflare token found. Add it at Settings > Secrets and variables > Actions > Secrets > New repository secret, named CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install GDAL and tippecanoe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdal-bin tippecanoe unzip
          ogr2ogr --version && tippecanoe --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build parcel tiles and search index
        run: scripts/build_parcels.sh

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the CLOUDFLARE_API_TOKEN (or KEY) repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add the CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          npm run build
          find dist -type f -size +25M | grep . && { echo "files over the 25 MiB Pages limit"; exit 1; } || true

      - name: Deploy to Cloudflare Pages
        working-directory: app
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Record data sources
        run: cat data/out/SOURCES.txt >> "$GITHUB_STEP_SUMMARY"
